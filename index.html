<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título principal -->
    <title>Registro de Apuestas - Apuestas 26/27</title>

    <!-- Meta descripción -->
    <meta name="description" content="Registro de Apuestas 26/27: Plataforma sencilla para gestionar, controlar y llevar el seguimiento de tus apuestas de forma eficiente.">

    <!-- Favicon (Icono de la pestaña) -->
    <link rel="icon" type="image/png" href="favicon.png">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contenedor">
        <h1>Registro de Apuestas</h1>
        <p>Gestiona tus apuestas de forma sencilla.</p>

        <!-- Formulario de acceso -->
        <div class="formulario">
            <input type="email" id="usuario" placeholder="Correo electrónico" required>
            <input type="password" id="password" placeholder="Contraseña" required>
        </div>

        <div class="botones">
            <button id="btnLogin">
                Iniciar sesión
            </button>
            <button id="btnRegistro">
                Crear cuenta
            </button>
        </div>
    </div>

    <!-- Script con tipo módulo para Firebase -->
    <script type="module" src="script.js"></script>
</body>
</html>
